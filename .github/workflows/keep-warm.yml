# Keeps the Mr Saloon backend awake on Render's free plan, which puts a
# service to sleep after 15 idle minutes (the first visitor then waits about a
# minute while it starts). One cheap request every 10 minutes is enough; the
# free plan's 750 instance-hours a month cover one service running all month.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Touch the backend
        # Any answer (even 401 - the root needs a token) means it is up.
        run: curl -s -o /dev/null -w "%{http_code} in %{time_total}s\n" --max-time 120 https://midland-saloon-backend.onrender.com/ || true
