spring.application.name=midland-saloon
#database configurations
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:midland_saloon}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

#server
server.port=8083

# JWT signing secret - MUST be set via the JWT_SECRET env var (no default,
# on purpose: this repo is public, so a committed secret would let anyone
# forge admin tokens). See README/local setup notes for the local value.
jwt.secret=${JWT_SECRET}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#spring.datasource.driver-class-name=org.postgresql.driver
spring.jpa.hibernate.ddl-auto=update


# Enable SQL query logging
spring.jpa.show-sql=false

# Format SQL for readability
spring.jpa.properties.hibernate.format_sql=false

# Log parameter values (important for debugging!)



file.upload-dir=uploads/
spring.web.resources.static-locations=file:uploads/

# Profile pictures from a phone camera are commonly several MB;
# the 1MB Spring Boot default would reject them.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

