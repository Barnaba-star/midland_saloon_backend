spring.application.name=midland-saloon
#database configurations
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:midland_saloon}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:barry}

#server
server.port=8083

# JWT signing secret - override via JWT_SECRET env var in production.
# Default below matches the key already baked into tokens issued before this
# was externalized, so existing sessions keep working until it's rotated.
jwt.secret=${JWT_SECRET:bD3gQh+Y3r2kPzUvuJc6J5ZTbUR8gf59E/PLuXBn07sRj1MLzGevTyH7EKKmXVrRQD4VMyMv8q8tG26ZkC3I5Q==\"}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#spring.datasource.driver-class-name=org.postgresql.driver
spring.jpa.hibernate.ddl-auto=update


# Enable SQL query logging
spring.jpa.show-sql=false

# Format SQL for readability
spring.jpa.properties.hibernate.format_sql=false

# Log parameter values (important for debugging!)



file.upload-dir=uploads/
spring.web.resources.static-locations=file:uploads/

# Profile pictures from a phone camera are commonly several MB;
# the 1MB Spring Boot default would reject them.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

