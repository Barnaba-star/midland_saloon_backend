spring.application.name=midland-saloon

# Where the browser is serving this system's frontend from (comma-separated
# list allowed). Locally the saloon frontend runs on 4200.
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:4200}
#database configurations
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:midland_saloon}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

#server
# Railway (and most hosts) hand the port in PORT; 8083 locally.
server.port=${PORT:8083}

# Gzip JSON on the way out. Lists of sales, reports and settings shrink to a
# fraction of their size - what matters most to phones on mobile data.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024
# Enough request threads for one small instance; each idle thread still
# holds a stack, and 0.1 CPU cannot run 200 requests at once anyway.
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:40}
server.tomcat.threads.min-spare=4

# JWT signing secret - MUST be set via the JWT_SECRET env var (no default,
# on purpose: this repo is public, so a committed secret would let anyone
# forge admin tokens). See README/local setup notes for the local value.
jwt.secret=${JWT_SECRET}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#spring.datasource.driver-class-name=org.postgresql.driver
spring.jpa.hibernate.ddl-auto=update

# Kept on deliberately: several endpoints return entities straight to Jackson
# (SaloonStaff.storeOpen, IncomeExpenses.spends, User.roles, ...), and those
# lazy fields are read while the response is written, after the service's
# transaction. Turning this off would break them with LazyInitialization
# errors. Declared here so the startup warning is not mistaken for an oversight.
spring.jpa.open-in-view=true


# Enable SQL query logging
spring.jpa.show-sql=false

# Format SQL for readability
spring.jpa.properties.hibernate.format_sql=false

# Log parameter values (important for debugging!)

# Recording a sale writes whole lists at once (saveAll on sales, reports,
# stock). Without batching each row is its own round trip to Postgres.
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Lazy associations and collections touched in a loop - or by Jackson while
# writing a list of entities (IncomeExpenses.spends, User.roles on a user
# page) - load up to 50 owners per select instead of one select each.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# IN (...) lists are padded to powers of two so Hibernate and Postgres reuse
# a handful of statement plans instead of one per list length.
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# Connection pool. Sized for one backend on Render's free plan (0.1 CPU,
# 512 MB) against free Postgres: with a tenth of a CPU more than a handful of
# queries at once only queue inside the JVM anyway, and every idle connection
# costs memory on both sides. Override with DB_POOL_MAX on a bigger plan.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# Uploaded files (logos, profile pictures). On Railway point UPLOAD_DIR at a
# mounted volume, e.g. /data/uploads/ - the container's own disk is wiped on every deploy.
file.upload-dir=${UPLOAD_DIR:uploads/}
spring.web.resources.static-locations=file:${UPLOAD_DIR:uploads/}

# Snippe (api.snippe.sh) - Tanzania mobile money payments for branch
# subscriptions. No defaults on purpose (public repo, real money).
snippe.base-url=https://api.snippe.sh
snippe.api-key=${SNIPPE_API_KEY:}
snippe.webhook-secret=${SNIPPE_WEBHOOK_SECRET:}
# Snippe requires customer.email on every payment and rejects the request
# without it. Subscriptions are paid by a branch, not by a person, so the
# billing address is the platform's rather than whichever staff member
# happened to be at the keyboard - two of whom have no email on file at all.
snippe.billing-email=${SNIPPE_BILLING_EMAIL:midlandcompanylimited@gmail.com}

# Public HTTPS URL Snippe will POST payment.completed/failed events to.
snippe.webhook-url=${SNIPPE_WEBHOOK_URL:https://your-backend-domain.example.com/setting/webhooks/snippe}

# SMS. Off until a provider is wired in - see SmsClient. Nothing sends while
# this is false; attempts are still recorded as SKIPPED so the path can be
# checked before the API arrives.
sms.enabled=${SMS_ENABLED:false}
sms.app-name=${SMS_APP_NAME:Mr Saloon}
# Written into the message log only when explicitly turned on - a credentials
# text would otherwise sit in the application log in clear.
sms.log-body=${SMS_LOG_BODY:false}
# Filled in when the provider is chosen.
sms.base-url=${SMS_BASE_URL:}
sms.api-key=${SMS_API_KEY:}
sms.sender-id=${SMS_SENDER_ID:}

# Profile pictures from a phone camera are commonly several MB;
# the 1MB Spring Boot default would reject them.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Percentage of each completed branch subscription payment that goes to the
# staff member who registered that branch. Changing this only affects
# payments recorded from here on - the rate used is snapshot onto every
# subscription_payments row so past months never move.
commission.percent=10
